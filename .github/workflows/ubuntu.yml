name: Ubuntu 24.04 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1 libsecret-1-0 gnome-keyring python3-pil poppler-utils dbus-x11 xvfb xauth git patch ripgrep
      - name: Build standalone Linux x64 application
        run: bash scripts/build.sh
      - name: Unit and integration tests
        run: |
          work/build/runtime/node_modules/.bin/bun test ./tests/*.bun.ts
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/planner.test.js tests/connection-http.test.js
          python3 scripts/install.py --check
      - name: Isolated desktop smoke test
        env:
          XDG_CURRENT_DESKTOP: ubuntu:GNOME
          XDG_SESSION_TYPE: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a python3 tests/desktop_smoke.py
      - name: Package verified installer and corresponding sources
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: work/release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ubuntu
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          test -f "Archivia-${RELEASE_TAG#v}-linux-x64.run"
          sha256sum -c SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            test "$(cat draft.txt)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Archivia ${RELEASE_TAG#v}" --notes "Cliente no oficial para Linux: sincronización con Proton Drive y discos externos, duplicados y organización de archivos. Incluye actualizaciones desde GitHub Releases con descarga verificada SHA-256 y confirmación antes de instalar. Linux Mint y Ubuntu 24.04, x86-64 con SSE4.2. Descarga el archivo .run y ejecútalo con bash."
          fi
          gh release upload "$RELEASE_TAG" Archivia-* SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
